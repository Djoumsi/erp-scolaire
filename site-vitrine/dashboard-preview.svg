<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Dégradé de fond -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f0f4ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f0fff0;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Fond -->
  <rect width="800" height="600" fill="url(#bgGradient)"/>

  <!-- Header Navigation -->
  <rect x="0" y="0" width="800" height="60" fill="#0066cc"/>
  <text x="30" y="38" font-size="24" font-weight="bold" fill="white">📊 MBOA School Dashboard</text>

  <!-- Titre -->
  <text x="40" y="100" font-size="18" font-weight="bold" fill="#1a1a1a">Bienvenue - Année scolaire 2025-2026</text>

  <!-- CARTES STATISTIQUES -->

  <!-- Carte 1: Élèves -->
  <rect x="30" y="130" width="170" height="130" rx="10" fill="white" stroke="#0066cc" stroke-width="3"/>
  <circle cx="160" cy="155" r="20" fill="#0066cc"/>
  <text x="50" y="160" font-size="14" font-weight="bold" fill="#1a1a1a">👥 Élèves</text>
  <text x="50" y="220" font-size="32" font-weight="bold" fill="#0066cc">1,250</text>

  <!-- Carte 2: Personnel -->
  <rect x="230" y="130" width="170" height="130" rx="10" fill="white" stroke="#00a651" stroke-width="3"/>
  <circle cx="360" cy="155" r="20" fill="#00a651"/>
  <text x="250" y="160" font-size="14" font-weight="bold" fill="#1a1a1a">👨‍🏫 Personnel</text>
  <text x="260" y="220" font-size="32" font-weight="bold" fill="#00a651">85</text>

  <!-- Carte 3: Classes -->
  <rect x="430" y="130" width="170" height="130" rx="10" fill="white" stroke="#ff6b35" stroke-width="3"/>
  <circle cx="560" cy="155" r="20" fill="#ff6b35"/>
  <text x="450" y="160" font-size="14" font-weight="bold" fill="#1a1a1a">📚 Classes</text>
  <text x="470" y="220" font-size="32" font-weight="bold" fill="#ff6b35">48</text>

  <!-- Carte 4: Paiements -->
  <rect x="630" y="130" width="140" height="130" rx="10" fill="white" stroke="#9c27b0" stroke-width="3"/>
  <circle cx="740" cy="155" r="20" fill="#9c27b0"/>
  <text x="645" y="160" font-size="14" font-weight="bold" fill="#1a1a1a">💰 Paiements</text>
  <text x="665" y="220" font-size="32" font-weight="bold" fill="#9c27b0">92%</text>

  <!-- SECTION GRAPHIQUES -->
  <text x="40" y="295" font-size="16" font-weight="bold" fill="#1a1a1a">Graphiques</text>

  <!-- Graphique 1: Barres - Paiements 6 mois -->
  <rect x="30" y="320" width="360" height="200" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="50" y="345" font-size="13" font-weight="bold" fill="#666">Paiements 6 mois</text>

  <!-- Axes -->
  <line x1="50" y1="500" x2="340" y2="500" stroke="#999" stroke-width="1"/>
  <line x1="50" y1="360" x2="50" y2="500" stroke="#999" stroke-width="1"/>

  <!-- Barres du graphique -->
  <rect x="65" y="455" width="30" height="45" fill="#0066cc"/>
  <text x="70" y="515" font-size="11" fill="#666">Jan</text>

  <rect x="105" y="420" width="30" height="80" fill="#0066cc"/>
  <text x="110" y="515" font-size="11" fill="#666">Fév</text>

  <rect x="145" y="440" width="30" height="60" fill="#0066cc"/>
  <text x="150" y="515" font-size="11" fill="#666">Mar</text>

  <rect x="185" y="400" width="30" height="100" fill="#0066cc"/>
  <text x="190" y="515" font-size="11" fill="#666">Avr</text>

  <rect x="225" y="370" width="30" height="130" fill="#0066cc"/>
  <text x="230" y="515" font-size="11" fill="#666">Mai</text>

  <rect x="265" y="350" width="30" height="150" fill="#0066cc"/>
  <text x="270" y="515" font-size="11" fill="#666">Juin</text>

  <!-- Graphique 2: Répartition genre -->
  <rect x="420" y="320" width="350" height="200" rx="8" fill="white" stroke="#e0e0e0" stroke-width="1"/>
  <text x="440" y="345" font-size="13" font-weight="bold" fill="#666">Répartition par genre</text>

  <!-- Pie chart simplifié -->
  <circle cx="550" cy="430" r="50" fill="#0066cc" opacity="0.8"/>
  <circle cx="550" cy="430" r="50" fill="#00a651" opacity="0.8" clip-path="polygon(50% 0%, 100% 0%, 100% 100%)"/>

  <text x="620" y="415" font-size="12" fill="#1a1a1a">♂️ Garçons: 52%</text>
  <text x="620" y="450" font-size="12" fill="#1a1a1a">♀️ Filles: 48%</text>

  <!-- Footer -->
  <line x1="0" y1="550" x2="800" y2="550" stroke="#e0e0e0" stroke-width="1"/>
  <text x="40" y="580" font-size="11" fill="#999">✓ Données en temps réel  |  ✓ Mise à jour automatique  |  ✓ Exports Excel/PDF disponibles</text>
</svg>
